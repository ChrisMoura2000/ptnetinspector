<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../static/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document-TCC</title>
</head>
<style>
    /*UNICO TRECHO DE CODIGO COPIADO DA INTERNET FOI ESSA TAG STYLE #loading*/
    body {
        font-family: Arial, sans-serif;
    }

    .form {
        text-align: center;
        margin-top: 5%;
    }

    .card {
        text-align: left;
        border: 1px solid rgba(0, 0, 0, 0.43)
    }

    select {
        font-family: inherit;
        font-size: inherit;
    }

    /* Estilo do Spinner de Loading */
    #loading {
        display: none;
        /* Escondido por padrão */
        margin: 20px auto;
        border: 6px solid #f3f3f3;
        border-radius: 50%;
        border-top: 6px solid #3498db;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>

<body>
    <h1>Selecione o tipo de scan</h1>
    <label>
        <input type="radio" name="option" value="p">Passivo</input>
    </label>
    <label>
        <input type="radio" name="option" value="a">Active</input>
    </label>
    <label>
        <input type="radio" name="option" value="a+">Agressive</input>
    </label>
    <label>
        <input type="radio" name="option" value="802.1x">802.1x</input>
    </label>
    <select id="interface" name="interface">
        <option value="">Selecione a Interface de Rede</option>
        {% for interface in interfaces %}
        # Aparentemente, não dá para quebrar a linha em um texto dentro do option. Maioria dos fóruns recomendam usar o title. 
        <option value="{{ interface.name }}" title="IPv4: {{ interface.ipv4 or 'N/A' }} | IPv6: {{ interface.ipv6 or 'N/A' }}">
            {{ interface.idif }}. {{ interface.name }}
        </option>
        {% endfor %}
    </select>
    <button id="submit">Enviar</button>

    <div id="loading"></div>
    <div id="errorSpace"></div>
    <div id="tabela" style="display:none"></div>

</body>
<script>

    function formatToHTML(item, desc) {
        let resultHTML = `<h2>${item.type}</h2>`
        let vulnerabilitiesHTML = ''
        let properties_key = Object.keys(item.properties)
        let properties_values = Object.values(item.properties)

        for (let i = 0; i < properties_key.length; i++) {
            vulnerabilitiesHTML = '<h3>Vulnerabilidades</h3>'
            resultHTML += `            
            <div>
                <span>${properties_key[i]}: </span>
                <span>${properties_values[i]}</span>
            </div>
                `
            if (item.vulnerabilities.length > 0) {
                for (let iVuln = 0; iVuln < item.vulnerabilities.length; iVuln++) {
                    code_vulnerabilitie = item.vulnerabilities[iVuln]["vulnCode"]
                    vulnerabilitiesHTML += `
                <div>
                    <span>Code: ${code_vulnerabilitie}</span>
                    <br>
                    <span>Descricao: ${desc[code_vulnerabilitie]}</span>
                    </div>
                `
                }

            } else {
                vulnerabilitiesHTML = "<h3>Vulnerabilidade não encontrada</h3>"
            }
        }

        return resultHTML + vulnerabilitiesHTML
    }

    function isLoading(option) {
        loadingDiv = document.getElementById('loading')
        if (option) {
            loadingDiv.style.display = 'block'
        } else {
            loadingDiv.style.display = 'none'
        }
    }

    btn = document.getElementById("submit")
    btn.addEventListener('click', async () => {
        isLoading(true)

        inspect_type = document.querySelector('input[name="option"]:checked').value
        interface_selcted = document.getElementById("interface").value

        bodyData = {'inspect_type': inspect_type, 'interface_selcted': interface_selcted}
        tableDiv = document.getElementById('tabela')

        let mock_API = '/scan_mock'
        let real_API = '/scanreal'
        try {
            requestAPI = await fetch(real_API, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(bodyData)
            })

            response = await requestAPI.json()

            nodes = response.scan_returned.results.nodes
            descriptions = response.description_dict

            if ('erro' in response) {
                alert(response.erro)
            }

            isLoading(false)

            for (let i = 0; i < nodes.length; i++) {
                htmlContent = formatToHTML(nodes[i], descriptions)
                tableDiv.innerHTML += `
                    <div class="card">
                        ${htmlContent}
                    </div>

                `
            }

            tableDiv.style.display = "block"

        } catch (error) {
            console.log('dentro do catch, erro: ', error);
            isLoading(false)

            divError = document.getElementById('errorSpace')
            divError.innerHTML = "<h1>Erro</h1>"
        }

    })

</script>

</html>
