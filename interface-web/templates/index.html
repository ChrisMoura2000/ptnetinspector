<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTNetInspector - Inspeção de rede</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .form {
            text-align: center;
            margin-top: 5%;
        }

        .card {
            text-align: left;
            border: 1px solid rgba(0, 0, 0, 0.43);
            border-radius: 5px;
            padding: 12px;
            margin: 12px 0;
            overflow-wrap: anywhere;
        }

        select, button {
            font-family: inherit;
            font-size: inherit;
            margin: 5px;
            padding: 7px;
        }

        #loading {
            display: none;
            margin: 20px auto;
            border: 6px solid #f3f3f3;
            border-radius: 50%;
            border-top: 6px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        #errorSpace {
            color: #a00000;
        }

        #results {
            margin-top: 25px;
        }

        #download-pdf {
            display: none;
        }

        .field {
            margin: 5px 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <h1>Inspeção de rede</h1>

    <h2>Selecione o tipo de scan</h2>

    <label>
        <input type="radio" name="option" value="p">
        Passivo
    </label>

    <label>
        <input type="radio" name="option" value="a">Ativo</input>
    </label>

    <label>
        <input type="radio" name="option" value="a+">Agressivo</input>
    </label>

    <!-- Já que não estamos mexendo com ele, podemos deletar essa opção? 
    <label>
        <input type="radio" name="option" value="802.1x">802.1x</input>
    </label>
    -->

    <p>
        <select id="interface" name="interface">
            <option value="">Selecione a interface de rede</option>

            {% for interface in interfaces %}
            <option
                value="{{ interface.name }}"
                title="IPv4: {{ interface.ipv4 or 'N/A' }} | IPv6: {{ interface.ipv6 or 'N/A' }}">
                {{ interface.idif }}. {{ interface.name }}
            </option>
            {% endfor %}
        </select>

        <button id="submit" type="button">Executar scan</button>
    </p>

    <div id="loading"></div>
    <div id="errorSpace" role="alert"></div>
    <div id="tabela" style="display:none"></div>

    <div id="results" style="display: none;">
        <h2>Resultados do scan</h2>
        <div id="scanInfo"></div>
        <div id="networkProperties"></div>
        <div id="devices"></div>
        <div id="vulnerabilities"></div>

        <button id="download-pdf" type="button">
            Baixar relatório em PDF
        </button>
    </div>

    <script>
        let reportData = null;

        const submitButton = document.getElementById("submit");
        const downloadButton = document.getElementById("download-pdf");
        const loading = document.getElementById("loading");
        const errorSpace = document.getElementById("errorSpace");
        const resultsDiv = document.getElementById("results");

        function addTextElement(parent, tag, text, className = "") {
            const element = document.createElement(tag);
            element.textContent = text ?? "";
            if (className) element.className = className;
            parent.appendChild(element);
            return element;
        }

        function addField(parent, label, value) {
            const row = document.createElement("div");
            row.className = "field";

            const labelElement = document.createElement("strong");
            labelElement.textContent = label + ": ";
            row.appendChild(labelElement);

            const valueElement = document.createElement("span");
            valueElement.textContent =
                value !== null && typeof value === "object"
                    ? JSON.stringify(value)
                    : String(value ?? "N/A");

            row.appendChild(valueElement);
            parent.appendChild(row);
        }

        function renderReport(report) {
            document.getElementById("scanInfo").replaceChildren();
            document.getElementById("networkProperties").replaceChildren();
            document.getElementById("devices").replaceChildren();
            document.getElementById("vulnerabilities").replaceChildren();

            const scanInfo = document.getElementById("scanInfo");
            addTextElement(scanInfo, "h3", "Informações do scan");
            addField(scanInfo, "Comando", report.command);
            addField(scanInfo, "Status", report.status);

            if (report.message) {
                addField(scanInfo, "Mensagem", report.message);
            }

            const networkDiv = document.getElementById("networkProperties");
            addTextElement(networkDiv, "h3", "Propriedades da rede");

            const networkProperties = report.network_properties || {};
            for (const [key, value] of Object.entries(networkProperties)) {
                addField(networkDiv, key, value);
            }

            const devicesDiv = document.getElementById("devices");
            addTextElement(devicesDiv, "h3", "Dispositivos identificados");

            for (const device of report.devices || []) {
                const card = document.createElement("div");
                card.className = "card";

                addTextElement(
                    card,
                    "h4",
                    device.properties?.name || "Dispositivo"
                );

                for (const [key, value] of Object.entries(device.properties || {})) {
                    addField(card, key, value);
                }

                const addresses = device.addresses || [];
                if (addresses.length) {
                    addTextElement(card, "strong", "Endereços associados");

                    for (const address of addresses) {
                        addField(
                            card,
                            address.properties?.protocol || "Endereço",
                            address.properties?.IP || "IP desconhecido"
                        );
                    }
                }

                devicesDiv.appendChild(card);
            }

            const vulnerabilitiesDiv =
                document.getElementById("vulnerabilities");

            addTextElement(
                vulnerabilitiesDiv,
                "h3",
                "Vulnerabilidades identificadas"
            );

            const vulnerabilities = report.vulnerabilities || [];

            if (!vulnerabilities.length) {
                addTextElement(
                    vulnerabilitiesDiv,
                    "p",
                    "Nenhuma vulnerabilidade identificada no resultado."
                );
            }

            for (const vulnerability of vulnerabilities) {
                const card = document.createElement("div");
                card.className = "card";

                addTextElement(card, "h4", vulnerability.code);
                addField(card, "Descrição", vulnerability.descricao);
                addField(card, "Correção recomendada", vulnerability.correcao);
                addField(
                    card,
                    "Ativos associados",
                    (vulnerability.assets || []).join(", ")
                );

                vulnerabilitiesDiv.appendChild(card);
            }

            resultsDiv.style.display = "block";
            downloadButton.style.display = "inline-block";
        }

        submitButton.addEventListener("click", async () => {
            const selectedOption =
                document.querySelector('input[name="option"]:checked');
            const selectedInterface =
                document.getElementById("interface").value;

            errorSpace.textContent = "";
            resultsDiv.style.display = "none";
            downloadButton.style.display = "none";
            reportData = null;

            if (!selectedOption) {
                errorSpace.textContent = "Selecione o tipo de scan.";
                return;
            }

            if (!selectedInterface) {
                errorSpace.textContent = "Selecione uma interface de rede.";
                return;
            }

            loading.style.display = "block";
            submitButton.disabled = true;

            try {
                const response = await fetch("/scanreal", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inspect_type: selectedOption.value,
                        interface_selcted: selectedInterface
                    })
                });

                const data = await response.json();

                if (!response.ok || data.erro) {
                    throw new Error(data.erro || "Falha ao executar o scan.");
                }

                reportData = data.report;
                renderReport(reportData);

            } catch (error) {
                errorSpace.textContent = error.message || "Ocorreu um erro.";
            } finally {
                loading.style.display = "none";
                submitButton.disabled = false;
            }
        });

        downloadButton.addEventListener("click", async () => {
            if (!reportData) {
                errorSpace.textContent = "Execute um scan antes de baixar o PDF.";
                return;
            }

            errorSpace.textContent = "";
            downloadButton.disabled = true;

            try {
                const response = await fetch("/download_pdf", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(reportData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.erro || "Falha ao gerar o PDF.");
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = url;
                link.download = "relatorio_ptnetinspector.pdf";
                document.body.appendChild(link);
                link.click();
                link.remove();

                URL.revokeObjectURL(url);

            } catch (error) {
                errorSpace.textContent =
                    error.message || "Não foi possível baixar o PDF.";
            } finally {
                downloadButton.disabled = false;
            }
        });
    </script>
</body>
</html>
